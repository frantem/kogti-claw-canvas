# Nginx configuration for KOGTI nail studio website
# Copy this file to /etc/nginx/sites-available/kogti

server {
    listen 80;
    server_name kogtistudio.by www.kogtistudio.by;
    
    # Document root - where built files are located
    root /var/www/kogti/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable caching for index.html to ensure updates are loaded
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets folder - built JS/CSS files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle all other requests - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Optional: Redirect HTTP to HTTPS (enable after SSL setup)
    # return 301 https://$server_name$request_uri;
}

