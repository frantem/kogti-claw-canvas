# Nginx configuration for KOGTI nail studio website
# Copy this file to /etc/nginx/sites-available/kogti

server {
    listen 80;
    server_name kogtistudio.by www.kogtistudio.by;
    
    # Document root - where built files are located
    root /var/www/kogti/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable caching for index.html to ensure updates are loaded
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets folder - built JS/CSS files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Custom 404 page for truly non-existent files
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/kogti/dist;
        internal;
    }

    # Handle all other requests - SPA fallback
    location / {
        # First, try to serve the file directly
        # If it doesn't exist, check if it's a valid React route
        # If not a valid route, serve 404.html with proper status code
        try_files $uri $uri/ @react_routes;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Handle React routes
    location @react_routes {
        # Valid React routes: /, /auth, /admin
        # Return index.html for valid routes, 404 for invalid ones
        set $is_valid_route 0;
        
        if ($uri = /) {
            set $is_valid_route 1;
        }
        if ($uri = /auth) {
            set $is_valid_route 1;
        }
        if ($uri = /admin) {
            set $is_valid_route 1;
        }
        
        # If valid route, serve index.html
        if ($is_valid_route = 1) {
            rewrite ^ /index.html last;
        }
        
        # If not a valid route, return 404
        return 404;
    }

    # Optional: Redirect HTTP to HTTPS (enable after SSL setup)
    # return 301 https://$server_name$request_uri;
}

